name: Windows agent installer
on:
  workflow_dispatch:
  push:
    branches: [master]
permissions:
  contents: write
concurrency:
  group: windows-agent-release
  cancel-in-progress: false
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Bootstrap sources when Git sync has not delivered desktop yet
        shell: pwsh
        run: |
          if (-not (Test-Path 'desktop/build.ps1')) {
            $url = 'https://rmqidwtklzrtdxankyyg.supabase.co/storage/v1/object/public/public-assets/agent-build%2F796f125d2b19bb15bb4f10efd24f3be47abb0075345ea3f005ff90d6f9c62cbf.zip'
            Invoke-WebRequest $url -OutFile "$env:RUNNER_TEMP/source.zip"
            $hash = (Get-FileHash "$env:RUNNER_TEMP/source.zip" -Algorithm SHA256).Hash.ToLower()
            if ($hash -ne '796f125d2b19bb15bb4f10efd24f3be47abb0075345ea3f005ff90d6f9c62cbf') { throw 'Source checksum mismatch' }
            Expand-Archive "$env:RUNNER_TEMP/source.zip" -DestinationPath . -Force
          }
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install installer compiler
        shell: pwsh
        run: |
          $compiler = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6/ISCC.exe'
          if (-not (Test-Path $compiler)) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed' }
          }
      - name: Build standalone Windows app
        shell: pwsh
        run: ./desktop/build.ps1
      - name: Verify installer without starting observation
        shell: pwsh
        run: |
          $target = Join-Path $env:RUNNER_TEMP 'KaroserpSmoke'
          $setup = Start-Process -FilePath ./desktop/release/Karoserp-Setup.exe -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=$target") -Wait -PassThru
          if ($setup.ExitCode -ne 0) { throw 'Installation failed' }
          $check = Start-Process -FilePath "$target/Karoserp.exe" -ArgumentList '--self-test' -Wait -PassThru
          if ($check.ExitCode -ne 0) { throw 'Installed app self-test failed' }
          $bundle = Join-Path $env:RUNNER_TEMP 'KaroserpUpdate'
          Expand-Archive ./desktop/release/Karoserp-Update.zip $bundle -Force
          $result = Join-Path $env:RUNNER_TEMP 'update-result.json'
          $dataDir = Join-Path $env:APPDATA 'KaroserPAjan'
          New-Item $dataDir -ItemType Directory -Force | Out-Null
          $sentinel = Join-Path $dataDir 'update-smoke.txt'
          Set-Content $sentinel 'preserve-me'
          & ./desktop/karoserp_agent/ui/apply-update.ps1 -ProcessId 0 -InstallDir $target -BundleDir $bundle -ResultFile $result -NoRestart
          if ((Get-Content $result -Raw | ConvertFrom-Json).status -ne 'updated') { throw 'Binary update failed' }
          if ((Get-Content $sentinel).Trim() -ne 'preserve-me') { throw 'User data modified' }
          # Force a failing bundle and verify rollback leaves a working executable.
          Remove-Item "$bundle/Karoserp.exe" -Force
          Set-Content "$bundle/Karoserp.exe" 'invalid executable'
          & ./desktop/karoserp_agent/ui/apply-update.ps1 -ProcessId 0 -InstallDir $target -BundleDir $bundle -ResultFile $result -NoRestart
          if ((Get-Content $result -Raw | ConvertFrom-Json).status -ne 'failed') { throw 'Rollback not exercised' }
          $restored = Start-Process "$target/Karoserp.exe" -ArgumentList '--self-test' -Wait -PassThru
          if ($restored.ExitCode -ne 0) { throw 'Rollback left broken app' }
          $remove = Start-Process -FilePath "$target/unins000.exe" -ArgumentList '/VERYSILENT' -Wait -PassThru
          if ($remove.ExitCode -ne 0 -or (Test-Path "$target/Karoserp.exe")) { throw 'Uninstall failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: Karoserp-Windows-x64
          path: |
            desktop/release/Karoserp-Setup.exe
            desktop/release/Karoserp-Setup.exe.sha256
            desktop/release/Karoserp-Update.zip
            desktop/release/agent-release.json
          if-no-files-found: error
          retention-days: 14
      - name: Publish verified installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "windows-$env:GITHUB_RUN_NUMBER"
          gh release create $tag ./desktop/release/Karoserp-Setup.exe ./desktop/release/Karoserp-Setup.exe.sha256 ./desktop/release/Karoserp-Update.zip ./desktop/release/agent-release.json --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "Karoserp Windows $env:GITHUB_RUN_NUMBER" --notes 'Windows x64; installation, binary update, data preservation, rollback and uninstall smoke-tested. Unsigned build.' --latest
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
